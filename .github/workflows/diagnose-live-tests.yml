name: Diagnose LIVE unit tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-test-groups:
    name: LIVE tests - ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: fresh-start
            pattern: '*fresh_start*'
          - group: monday-weekend
            pattern: '*monday*'
          - group: friday-weekend
            pattern: '*friday*'
          - group: references
            pattern: '*reference*'
          - group: live-room
            pattern: '*live_room*'
          - group: polling
            pattern: '*poll*'
          - group: schedule-history
            pattern: '*schedule*'
          - group: remaining-live
            pattern: '*final*'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Run isolated LIVE test group
        run: timeout 240s ./gradlew --no-daemon testDebugUnitTest --tests 'com.myanmar.ledger2d.feature.live.LiveCollectorTest.${{ matrix.pattern }}' --info --stacktrace
