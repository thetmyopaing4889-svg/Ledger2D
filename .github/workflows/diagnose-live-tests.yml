name: Diagnose LIVE test isolation

on:
  push:
    branches: [fix/daily-flow-final-build]
  workflow_dispatch:

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        test:
          - monday_0930_starts_new_working_day_cycle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Run one LIVE test
        run: ./gradlew --no-daemon testDebugUnitTest --tests "com.myanmar.ledger2d.feature.live.LiveCollectorTest.${{ matrix.test }}" --console=plain
