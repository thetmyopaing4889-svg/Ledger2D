name: Diagnose test classes
on:
  push:
    branches: [fix/daily-flow-final-build]
  workflow_dispatch:
jobs:
  test-class:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        test:
          - com.myanmar.ledger2d.core.design.WorkingContextStoreTest
          - com.myanmar.ledger2d.core.domain.AgentWideLimitTest
          - com.myanmar.ledger2d.core.domain.AnalysisTest
          - com.myanmar.ledger2d.core.domain.BetParserTest
          - com.myanmar.ledger2d.core.domain.CalculatorsTest
          - com.myanmar.ledger2d.core.domain.DeviceCalendarTest
          - com.myanmar.ledger2d.core.domain.DrawScheduleTest
          - com.myanmar.ledger2d.core.domain.FormatExpansionTest
          - com.myanmar.ledger2d.core.domain.ValidationTest
          - com.myanmar.ledger2d.core.domain.WeeklyReportTest
          - com.myanmar.ledger2d.feature.live.LiveCollectorTest
          - com.myanmar.ledger2d.feature.live.LiveRoomKeeperTest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew
      - name: Run one test class
        run: ./gradlew --no-daemon testDebugUnitTest --tests "${{ matrix.test }}" --console=plain
