name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Unit tests, lint, and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'com.myanmar.ledger2d.feature.live.LiveCollectorTest.successful_0930_reference_starts_new_cycle_and_resets_cards' --tests 'com.myanmar.ledger2d.feature.live.LiveCollectorTest.late_0930_success_after_1130_fills_reference_without_resetting_cards_again' --tests 'com.myanmar.ledger2d.feature.live.LiveCollectorTest.live_room_patches_split_previous_result_date_from_current_cycle_references' --tests 'com.myanmar.ledger2d.feature.live.LiveCollectorTest.stale_provider_reference_does_not_complete_current_cycle' --tests 'com.myanmar.ledger2d.feature.live.LiveCollectorTest.stale_provider_1400_reference_does_not_complete_current_cycle' --tests 'com.myanmar.ledger2d.feature.live.LiveCollectorTest.friday_1630_current_day_partial_snapshot_wins_over_previous_day' --tests 'com.myanmar.ledger2d.feature.live.LiveCollectorTest.main_poll_cannot_erase_successful_current_day_reference' --tests 'com.myanmar.ledger2d.feature.live.LiveCollectorTest.friday_after_1700_rejects_previous_working_day_primary_feed' --tests 'com.myanmar.ledger2d.feature.live.LiveCollectorTest.friday_after_1700_does_not_fallback_to_thursday_when_friday_feed_is_unavailable' --tests 'com.myanmar.ledger2d.feature.live.LiveCollectorTest.schedule_aware_history_projection_hides_future_evening_result' --tests 'com.myanmar.ledger2d.feature.live.LiveCollectorTest.fresh_start_1230_does_not_promote_historical_evening_result_to_hero'
      - name: Release APK verification
        run: ./gradlew --no-daemon assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ledger2d-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ledger2d-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
