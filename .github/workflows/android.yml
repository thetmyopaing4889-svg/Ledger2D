name: Android CI
on:
  push:
    branches: [main, fix/403-live-integration-root-cause-20261007, refactor/daily-flow-refactor-plan, fix/0930-reference-primary-first-636, fix/build-666-candidate-acceptance, feature/hybrid-winning-number-auto-save-675, validate/closed-day-history-merge-clean, validate/targeted-closed-day-regressions]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Unit tests, lint, and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'com.myanmar.ledger2d.feature.live.LiveCollectorTest.explicit_history_off_marker_holds_previous_working_day_when_luke_flag_is_false' --tests 'com.myanmar.ledger2d.feature.live.LiveCollectorTest.explicit_history_off_marker_is_checked_when_running_app_reaches_0930' --tests 'com.myanmar.ledger2d.feature.live.LiveCollectorTest.completed_phase_cold_start_requests_luke_without_waiting_for_historical_recovery' lintDebug assembleDebug
      - name: Release APK verification
        run: ./gradlew --no-daemon assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ledger2d-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ledger2d-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
