name: Android CI
on:
  push:
    branches: [main, fix/403-live-integration-root-cause-20261007, refactor/daily-flow-refactor-plan, fix/0930-reference-primary-first-636, fix/build-666-candidate-acceptance, feature/hybrid-winning-number-auto-save-675, fix/closed-day-only-from-677-20261018, fix/build704-historical-rates-postresult-edits-20261023, fix/build720-four-regressions-20261025, fix/session-recalc-remove-settlement-20261025, fix/session-consistent-financials-20261027, fix/live-temporary-winner-20261028, feature/background-live-workmanager-from-742-20261029, feature/quick-entry-messenger-smart-input-20261029, feature/customer-analysis-rebuild, feature/customer-dashboard-batch-20261030, feature/bet-entries-dual-view-20261031, feature/customer-statements-20261031, feature/report-analysis-clean-pages-20261031, feature/analysis-digit-drilldown-20261031, feature/agent-report-parity-20261101, fix/agent-report-recheck-20261101, feature/agent-list-parity-build814-20261101, fix/agent-list-review-build815-20261101, feature/agent-digit-totals-build816-20261101, fix/agent-digit-totals-review-build817-20261101, feature/session-closed-number-formats-build818-20261101, fix/session-rules-recheck-build820-20261101, fix/dashboard-completion-build821-20261101, feature/home-commission-review-build822-20261101, fix/home-first-view-fit-build823-20261101, fix/home-commission-only-first-view-20261101, feature/home-quick-actions-four-icons-20261101, feature/full-bilingual-ui-20261102, fix/language-complete-ui-20261102, fix/language-final-audit-20261102, experiment/font-typography-lab-build930, feature/2d-analysis-timeline-redesign, feature/2d-research-workspace, feature/2d-rules-dual-view, fix/discovery-sampling-and-10k-audit-20261115, feature/cherry-discovery-v2-from-build1641, feature/cherry-v3-only-from-build1766, feature/cherry-v3-picks-summary-from-build1767, audit/cherry-v3-break-from-build1770, feature/cherry-v31-engine-only-from-build1772, feature/cherry-v32-search-optimization-from-build1775, feature/cherry-success-feedback-from-build1777, feature/cherry-deselect-backup-restore-from-build1782, feature/set-snapshot-core-from-build1796-20261118, feature/set-morning-live-handover-from-build1799, fix/set-ui-handover-regressions-from-build1800, fix/set-qa-isolation-audit-from-build1802-20261118, fix/set-snapshot-fetch-reliability-from-build1804-20261119, feature/set-continuous-live-probe-from-build1806-20261119, feature/set-3s-live-probe-from-build1810-20261119, feature/set-intermission-cherry-live-from-build1811-20261119, fix/set-hero-time-result-ui-from-build1813-20261120, feature/rules-library-betterdata-extension-from-build1814-20261120, fix/rules-1817-source-lookup-and-betterdata-20261120, fix/rules-expiry-and-source-labels-from-build1820-20261121, feature/rules-success-library-from-build1821-20261122, fix/rules-success-source-mapping-from-build1824-20261122, feature/home-cherry-premium-clean-from-build1825-20261122, fix/home-frosted-glass-orb-from-build1826-20261122, fix/home-orb-footer-card-polish-from-build1828-20261122, fix/home-gemini-image-assets-from-build1829-20261122, fix/home-3d-glass-whiteboxes-from-build1830-20261122, fix/home-single-glass-nav-from-build1832-20261122, fix/home-premium-depth-from-build1833-20261122, feature/home-six-micro-animations-from-build1835-20261122, feature/cherry-profile-gallery-forms-from-build1836-20261123, fix/profile-atomic-gallery-and-backup-qa-from-build1841-20261123, fix/profile-glass-gallery-preview-weekly-session-colors-from-1845-20261123, fix/profile-crop-clean-form-restore-weekly-from-build1847-20261123, fix/profile-form-field-header-from-build1852-20261123, fix/form-standard-header-polish-from-build1853-20261123, fix/form-final-polish-from-build1855-20261123, feature/profile-photo-connected-surfaces-from-build1858-20261123, fix/profile-photo-coverage-pass-from-build1861-20261123]
  pull_request:
    branches: [main, feature/2d-analysis-timeline-redesign, feature/2d-research-workspace]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Unit tests, lint, and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Show formula-discovery historical audit
        if: success()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              if not any(name in path for name in (
                  'CherryDiscovery2026CoverageTest',
                  'CherryDiscovery2023HoldoutTest',
                  'CherryDiscovery2024And2025HoldoutTest',
                  'CherryFormulaDiscoveryEngineTest',
                  'CherryDiscoveryBoundedHistoryTest',
                  'CherryDiscoveryResearchWindowTest',
                  'CherryDiscoveryWalkForwardTest',
                  'CherryV2ActualSeedAuditTest',
                  'CherryV2EngineContractTest',
                  'CherryV3BreakAuditTest',
                   'CherryV32SearchOptimizationTest',
              )):
                  continue
              root = ET.parse(path).getroot()
              for block in root.findall('.//system-out'):
                  for line in (block.text or '').splitlines():
                      if any(tag in line for tag in ('CHERRY_DISCOVERY_', 'CHERRY_SELECTION_', 'CHERRY_NULL_', 'CHERRY_BOUNDED_', 'CHERRY_RESEARCH_', 'CHERRY_V2_SEED_', 'CHERRY_V2_YEAR_SPLIT', 'CHERRY_V2_CORE_GATE', 'CHERRY_V3_BREAK_AUDIT', 'CHERRY_V32_TRACE_')):
                          print(line.strip())
          PY
      - name: Show unit test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root = ET.parse(path).getroot()
              for case in root.iter('testcase'):
                  for fail in case.findall('failure'):
                      print('FAILED', case.attrib.get('classname'), case.attrib.get('name'))
                      print(fail.attrib.get('message', ''))
                      print((fail.text or '')[:2500])
          PY
      - name: Release APK verification
        run: ./gradlew --no-daemon assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ledger2d-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ledger2d-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
