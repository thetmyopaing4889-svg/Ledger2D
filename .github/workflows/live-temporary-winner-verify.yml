name: LIVE Temporary Winner Verification

on:
  push:
    branches:
      - fix/live-temporary-winner-20261028
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Unit tests, lint and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger2d-live-unit-test-results
          path: app/build/test-results/testDebugUnitTest/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ledger2d-live-temporary-winner-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
