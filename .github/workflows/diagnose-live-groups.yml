name: Diagnose LIVE test groups

on:
  push:
    branches: [fix/daily-flow-final-build]
  workflow_dispatch:

jobs:
  live-group:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: group1
            tests: >-
              --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.daily_cycle_date_switches_at_0930_and_skips_weekend --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.fresh_start_tuesday_before_0930_recovers_monday_not_friday --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.fresh_start_tuesday_before_0930_rejects_friday_only_cached_hero --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.history_row_reconstructs_complete_held_feed --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.fresh_start_tuesday_before_0930_reconstructs_monday_full_held_state --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.fresh_start_monday_before_0930_reconstructs_friday_full_held_state --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.weekend_cold_start_reconstructs_friday_full_held_state --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.fresh_start_monday_0830_enters_friday_held_phase_completely --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.fresh_start_monday_1830_enters_monday_completed_phase_completely --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.fresh_start_tuesday_0830_enters_monday_held_phase_completely --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.fresh_start_tuesday_1130_enters_new_cycle_with_pending_sessions_and_live_gate --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.fresh_start_tuesday_1730_enters_tuesday_completed_phase_completely --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.app_clock_controls_phase_even_when_luke_reports_previous_day_time --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.current_day_live_replaces_previous_day_fallback_without_rewriting_live_engine --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.successful_0930_reference_starts_new_cycle_and_resets_cards --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.failed_0930_reference_keeps_old_cards_until_1130_then_resets --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.late_0930_success_after_1130_fills_reference_without_resetting_cards_again --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.weekend_holds_friday_state_without_entering_live_phase --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.sunday_also_holds_friday_state --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.monday_before_0930_still_holds_friday_state
          - group: group2
            tests: >-
              --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.weekend_collector_does_not_poll_live_or_references --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.friday_after_evening_final_stops_reference_retries --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.monday_0930_starts_new_working_day_cycle --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.eleven_thirty_current_day_live_keeps_live_engine_data_but_projection_resets_cards --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.monday_reference_response_keeps_friday_hero_until_morning_live --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.fresh_install_monday_before_morning_live_recovers_previous_final_without_local_cache --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.schedule_0930_is_reference --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.schedule_1129_is_reference --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.schedule_1130_starts_live --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.schedule_1200_is_still_live --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.schedule_1201_starts_final_catchup --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.schedule_1400_is_reference --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.schedule_1600_starts_evening_live --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.schedule_1630_starts_evening_final_catchup --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.previous_day_morning_response_shows_yesterdays_final_before_0930 --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.previous_day_feed_is_kept_until_0930 --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.previous_day_feed_remains_visible_after_0930_until_live_boundary --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.yesterday_live_and_today_reference_can_coexist --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.afternoon_reference_phase_does_not_promote_startup_luke_live_to_hero --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.afternoon_hold_starts_at_1400_and_stays_non_live
          - group: group3
            tests: >-
              --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.evening_live_resumes_exactly_at_1600 --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.morning_final_is_shown_immediately_after_final_response --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.evening_final_is_shown_immediately_after_final_response --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.fresh_start_0830_does_not_start_reference_or_live_polling --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.fresh_start_0935_reference_failure_keeps_yesterday_cards_until_1130 --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.fresh_start_0935_fetches_todays_reference_instead_of_historical_reference --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.fresh_start_1000_catches_up_0930_reference_without_live_polling --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.fresh_start_1500_catches_up_both_reference_slots_without_live_polling --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.fresh_start_1800_catches_up_reference_slots_without_starting_evening_live_polling --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.request_failure_keeps_last_successful_snapshot --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.slow_request_does_not_block_next_scheduled_request --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.late_older_response_cannot_overwrite_newer_response --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.final_result_cannot_regress_to_pending --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.background_polling_works_without_opening_live_screen --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.live_room_does_not_promote_previous_result_references_to_current_cycle --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.live_room_does_not_persist_current_day_references_before_0930 --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.live_room_full_evening_snapshot_is_one_current_day_patch --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.live_room_pending_patch_never_erases_existing_valid_values --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.live_room_morning_correction_can_update_morning_without_blocking_later_reference_retry --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.live_room_newer_provider_correction_updates_final_morning_result
          - group: group4
            tests: >-
              --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.live_room_older_morning_observation_cannot_regress_newer_morning_result --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.collector_persists_reference_snapshot_through_room_saver_without_changing_ui_flow --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.stale_provider_reference_does_not_complete_current_cycle --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.stale_provider_1400_reference_does_not_complete_current_cycle --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.friday_1630_current_day_partial_snapshot_wins_over_previous_day --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.stale_provider_reference_does_not_complete_afternoon_cycle --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.main_poll_cannot_erase_successful_current_day_reference --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.friday_after_1700_rejects_previous_working_day_primary_feed --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.friday_after_1700_does_not_fallback_to_thursday_when_friday_feed_is_unavailable --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.schedule_aware_history_projection_hides_future_evening_result --tests com.myanmar.ledger2d.feature.live.LiveCollectorTest.schedule_aware_history_final_uses_morning_before_evening_close
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew
      - name: Run LIVE test group
        run: ./gradlew --no-daemon testDebugUnitTest ${{ matrix.tests }} --console=plain
